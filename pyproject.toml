[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "recruitment-inbox-agent"
version = "0.1.0"
description = "Privacy-preserving recruitment inbox workflow agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Theo" }]
dependencies = [
  "aiohttp>=3.12,<4",
  "alembic>=1.16,<2",
  "azure-functions>=1.23,<2",
  "azure-identity>=1.25,<2",
  "azure-keyvault-secrets>=4.10,<5",
  "azure-storage-queue>=12.14,<13",
  "beautifulsoup4>=4.13,<5",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "lxml>=6,<7",
  "msal>=1.34,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.4,<26",
]

[project.scripts]
database-maintenance = "recruitment_agent.jobs.database_maintenance:main"
seed-companies = "recruitment_agent.jobs.company_seed:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
  "uvicorn>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recruitment_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires an external service such as PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "recruitment_agent"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "benchmarks"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["azure.functions.*", "msal", "msal.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
