name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --all-groups --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src benchmarks

      - name: Pytest
        run: uv run pytest

      - name: Replay extraction benchmark
        run: uv run python -m benchmarks.cli run extraction --mode replay
