name: deploy-production-infrastructure

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-infrastructure
  cancel-in-progress: true

jobs:
  scope:
    if: >-
      github.repository == 'ada-zl5825/Agenda-Agent' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
      schema_change: ${{ steps.scope.outputs.schema_change }}
      revision: ${{ steps.scope.outputs.revision }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Select infrastructure deployment
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "schema_change=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy_infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$REVISION^1" "$REVISION" | grep -Eq '^alembic/'; then
            echo "schema_change=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$REVISION^1" "$REVISION" | grep -Eq '^(alembic/|infra/|scripts/bootstrap-azure\.ps1$|\.github/workflows/deploy-infra\.yml$)'; then
            echo "deploy_infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_infra=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy_infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.deploy_infrastructure.outputs.functionAppUrl }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.revision }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            infra/main.parameters.json
            functionAppName=${{ vars.AZURE_FUNCTIONAPP_NAME }}
            postgresAdministratorPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            microsoftClientId=${{ vars.MICROSOFT_CLIENT_ID }}
            microsoftClientSecret=${{ secrets.MICROSOFT_CLIENT_SECRET }}
            microsoftConnectionId=${{ vars.MICROSOFT_CONNECTION_ID }}
            adminMicrosoftHomeAccountId=${{ vars.ADMIN_MICROSOFT_HOME_ACCOUNT_ID || '' }}
            tokenCacheEncryptionKey=${{ secrets.TOKEN_CACHE_ENCRYPTION_KEY }}
            linkEncryptionKey=${{ secrets.LINK_ENCRYPTION_KEY }}
            webSessionSigningKey=${{ secrets.WEB_SESSION_SIGNING_KEY }}
            opsApiToken=${{ secrets.OPS_API_TOKEN }}
            azureOpenAIEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAIDeployment=${{ vars.AZURE_OPENAI_DEPLOYMENT }}
            mailSyncEnabled=${{ vars.MAIL_SYNC_ENABLED || 'false' }}
            workflowProcessingEnabled=${{ vars.WORKFLOW_PROCESSING_ENABLED || 'false' }}
            calendarSyncEnabled=${{ vars.CALENDAR_SYNC_ENABLED || 'false' }}
            dailyBriefEnabled=${{ vars.DAILY_BRIEF_ENABLED || 'false' }}
            dailyBriefRecipient=${{ vars.DAILY_BRIEF_RECIPIENT || '' }}
          deploymentMode: Validate

      - name: Deploy infrastructure
        id: deploy_infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          deploymentName: agenda-agent-${{ github.run_number }}
          template: infra/main.bicep
          parameters: >-
            infra/main.parameters.json
            functionAppName=${{ vars.AZURE_FUNCTIONAPP_NAME }}
            postgresAdministratorPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            microsoftClientId=${{ vars.MICROSOFT_CLIENT_ID }}
            microsoftClientSecret=${{ secrets.MICROSOFT_CLIENT_SECRET }}
            microsoftConnectionId=${{ vars.MICROSOFT_CONNECTION_ID }}
            adminMicrosoftHomeAccountId=${{ vars.ADMIN_MICROSOFT_HOME_ACCOUNT_ID || '' }}
            tokenCacheEncryptionKey=${{ secrets.TOKEN_CACHE_ENCRYPTION_KEY }}
            linkEncryptionKey=${{ secrets.LINK_ENCRYPTION_KEY }}
            webSessionSigningKey=${{ secrets.WEB_SESSION_SIGNING_KEY }}
            opsApiToken=${{ secrets.OPS_API_TOKEN }}
            azureOpenAIEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAIDeployment=${{ vars.AZURE_OPENAI_DEPLOYMENT }}
            mailSyncEnabled=${{ vars.MAIL_SYNC_ENABLED || 'false' }}
            workflowProcessingEnabled=${{ vars.WORKFLOW_PROCESSING_ENABLED || 'false' }}
            calendarSyncEnabled=${{ vars.CALENDAR_SYNC_ENABLED || 'false' }}
            dailyBriefEnabled=${{ vars.DAILY_BRIEF_ENABLED || 'false' }}
            dailyBriefRecipient=${{ vars.DAILY_BRIEF_RECIPIENT || '' }}
          deploymentMode: Incremental

      - name: Deploy database-maintenance foundation
        id: deploy_database_maintenance_foundation
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          deploymentName: agenda-db-foundation-${{ github.run_number }}
          template: infra/database-maintenance-foundation.bicep
          deploymentMode: Incremental

      - name: Build immutable database-maintenance image
        id: build_database_maintenance_image
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.deploy_database_maintenance_foundation.outputs.containerRegistryName }}
          REGISTRY_SERVER: ${{ steps.deploy_database_maintenance_foundation.outputs.containerRegistryLoginServer }}
          REVISION: ${{ needs.scope.outputs.revision }}
        run: |
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "agenda-agent-db-maintenance:$REVISION" \
            --file infra/database-maintenance/Dockerfile \
            .
          image_digest="$(az acr manifest show-metadata \
            --registry "$REGISTRY_NAME" \
            --name "agenda-agent-db-maintenance:$REVISION" \
            --query digest \
            --output tsv)"
          echo "image=$REGISTRY_SERVER/agenda-agent-db-maintenance@$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy database-maintenance job
        id: deploy_database_maintenance_job
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          deploymentName: agenda-db-job-${{ github.run_number }}
          template: infra/database-maintenance-job.bicep
          parameters: >-
            containerAppsEnvironmentName=${{ steps.deploy_database_maintenance_foundation.outputs.containerAppsEnvironmentName }}
            databaseMaintenanceIdentityId=${{ steps.deploy_database_maintenance_foundation.outputs.databaseMaintenanceIdentityId }}
            containerRegistryLoginServer=${{ steps.deploy_database_maintenance_foundation.outputs.containerRegistryLoginServer }}
            databaseMaintenanceImage=${{ steps.build_database_maintenance_image.outputs.image }}
            databaseUrlSecretUri=${{ steps.deploy_database_maintenance_foundation.outputs.databaseUrlSecretUri }}
          deploymentMode: Incremental

      - name: Deploy Azure Functions application
        if: needs.scope.outputs.schema_change != 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .
          remote-build: true
          respect-funcignore: true

      - name: Verify liveness endpoint
        if: needs.scope.outputs.schema_change != 'true'
        shell: bash
        env:
          FUNCTION_URL: ${{ steps.deploy_infrastructure.outputs.functionAppUrl }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$FUNCTION_URL/health/live"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Hold application deployment until the migration succeeds
        if: needs.scope.outputs.schema_change == 'true'
        shell: bash
        run: |
          echo "A new immutable database-maintenance image is ready."
          echo "Run the Container Apps Job with operation=migrate, verify success, then dispatch deploy-production-app."
