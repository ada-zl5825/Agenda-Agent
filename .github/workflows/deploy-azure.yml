name: deploy-production

on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.repository == 'ada-zl5825/Agenda-Agent' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ steps.deploy_infrastructure.outputs.functionAppUrl }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            infra/main.parameters.json
            functionAppName=${{ vars.AZURE_FUNCTIONAPP_NAME }}
            postgresAdministratorPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            microsoftClientId=${{ vars.MICROSOFT_CLIENT_ID }}
            microsoftClientSecret=${{ secrets.MICROSOFT_CLIENT_SECRET }}
            microsoftConnectionId=${{ vars.MICROSOFT_CONNECTION_ID }}
            tokenCacheEncryptionKey=${{ secrets.TOKEN_CACHE_ENCRYPTION_KEY }}
            linkEncryptionKey=${{ secrets.LINK_ENCRYPTION_KEY }}
            azureOpenAIEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAIDeployment=${{ vars.AZURE_OPENAI_DEPLOYMENT }}
            calendarSyncEnabled=${{ vars.CALENDAR_SYNC_ENABLED || 'false' }}
          deploymentMode: Validate

      - name: Deploy infrastructure
        id: deploy_infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          deploymentName: agenda-agent-${{ github.run_number }}
          template: infra/main.bicep
          parameters: >-
            infra/main.parameters.json
            functionAppName=${{ vars.AZURE_FUNCTIONAPP_NAME }}
            postgresAdministratorPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            microsoftClientId=${{ vars.MICROSOFT_CLIENT_ID }}
            microsoftClientSecret=${{ secrets.MICROSOFT_CLIENT_SECRET }}
            microsoftConnectionId=${{ vars.MICROSOFT_CONNECTION_ID }}
            tokenCacheEncryptionKey=${{ secrets.TOKEN_CACHE_ENCRYPTION_KEY }}
            linkEncryptionKey=${{ secrets.LINK_ENCRYPTION_KEY }}
            azureOpenAIEndpoint=${{ vars.AZURE_OPENAI_ENDPOINT }}
            azureOpenAIDeployment=${{ vars.AZURE_OPENAI_DEPLOYMENT }}
            calendarSyncEnabled=${{ vars.CALENDAR_SYNC_ENABLED || 'false' }}
          deploymentMode: Incremental

      - name: Deploy Azure Functions application
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .
          remote-build: true
          respect-funcignore: true

      - name: Verify health endpoint
        shell: bash
        env:
          FUNCTION_URL: ${{ steps.deploy_infrastructure.outputs.functionAppUrl }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$FUNCTION_URL/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
